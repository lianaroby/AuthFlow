
services:
  database:
    image: postgres:16
    container_name: authflow-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: authflow
    ports:
      - "5435:5432"
    volumes:
      - authflow-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: authflow-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: authflow
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: authflow-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_TARGET: http://backend:3000
    depends_on:
      - backend

volumes:
  authflow-data:
