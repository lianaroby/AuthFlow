
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            width: 300px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: gray;
            font-size: 13px;
            margin-bottom: 20px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #0866ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .links {
            font-size: 12px;
            margin-top: 15px;
        }

        a {
            color: #0866ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Sign In</h2>
        <p class="subtitle">Welcome back!</p>

        <form action="/login" method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">Sign In</button>

        </form>

        <div class="links">
            <p>Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>
        </div>

    </div>

</body>
</html>
