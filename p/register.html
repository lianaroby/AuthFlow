
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-box {
            background-color: white;
            width: 300px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: left;
            margin-bottom: 5px;
        }

        .subtitle {
            color: gray;
            font-size: 13px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #0866ff;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #0866ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #0052cc;
        }

        .links {
            font-size: 12px;
            margin-top: 15px;
        }

        a {
            color: #0866ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>Create Account</h2>

        <p class="subtitle">Join us today!</p>

        <form id="registerForm" action="/register" method="POST">

            <input form="registerForm"
                   type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input form="registerForm"
                   type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input form="registerForm"
                   type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <input form="registerForm"
                   type="password"
                   name="confirmPassword"
                   placeholder="Confirm Password"
                   required>

            <button type="submit">Sign Up</button>

        </form>

        <div class="links">

            <p>Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
